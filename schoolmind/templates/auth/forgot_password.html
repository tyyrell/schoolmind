{% extends "base.html" %}
{% block title %}Reset password · SchoolMind{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form class="pixel-form" method="post">
    {% include "partials/form_csrf.html" %}
    <span class="eyebrow">Account recovery</span>
    <h1>Queue a reset link</h1>
    <p class="muted">Email delivery is provider-ready. Until SMTP is connected, reset messages appear in the outbox.</p>
    <label>Email<input name="email" type="email" required></label>
    <button class="btn primary" type="submit">Request reset</button>
  </form>
</section>
{% endblock %}
