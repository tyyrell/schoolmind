{% extends "base.html" %}
{% block title %}Set new password · SchoolMind{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form class="pixel-form" method="post">
    {% include "partials/form_csrf.html" %}
    <span class="eyebrow">Password reset</span>
    <h1>Set a new password</h1>
    <p class="muted">Account: {{ reset.email }}</p>
    <label>New password<input name="password" type="password" minlength="8" required></label>
    <button class="btn primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
